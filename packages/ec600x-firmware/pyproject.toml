[project]
name = "ec600x-firmware"
version = "0.1.0"
description = "QuecPython embedded firmware project for Quectel EC600X-EVB (EC600M Cat 1 bis)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "pyright>=1.1.390",
    "pyserial>=3.5",
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "SIM", "RUF"]
ignore = ["E501", "A003"]

[tool.ruff.lint.per-file-ignores]
"src/**/*.py" = ["RUF002", "RUF003", "UP032", "UP037"]
"tests/**/*.py" = ["N802"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pyright]
include = ["src", "tools", "tests"]
exclude = ["**/__pycache__", "dist", ".venv"]
stubPath = "typings"
typeCheckingMode = "strict"
pythonVersion = "3.10"
pythonPlatform = "Darwin"
reportMissingImports = "error"
reportMissingModuleSource = "none"
reportMissingTypeStubs = "error"
reportUnknownParameterType = "error"
reportUnknownArgumentType = "error"
reportUnknownLambdaType = "error"
reportUnknownVariableType = "error"
reportUnknownMemberType = "error"
reportMissingParameterType = "error"
reportMissingTypeArgument = "error"
reportInvalidTypeForm = "error"
reportUntypedFunctionDecorator = "error"
reportUntypedClassDecorator = "error"
reportUntypedBaseClass = "error"
reportUntypedNamedTuple = "error"
reportPrivateUsage = "error"
reportTypeCommentUsage = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnreachable = "error"

executionEnvironments = [
    { root = "src", extraPaths = ["src"] },
    { root = "tests", extraPaths = ["src"] },
    { root = "tools" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
